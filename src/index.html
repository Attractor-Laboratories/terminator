<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"><title>Terminator</title><link rel="stylesheet" href="renderer.css"></head><body>
<header class="titlebar"><button id="overview-button" class="overview-button" type="button" title="Overview of all workspaces (⇧⌘O)" aria-pressed="false"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="1.5" y="2.5" width="3.6" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="6.2" y="2.5" width="3.6" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="10.9" y="2.5" width="3.6" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>Overview</button><button id="git-button" class="overview-button git-button" type="button" title="Git: branches, worktrees and pull requests (⇧⌘G)" aria-pressed="false"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="4.5" cy="3.5" r="1.7" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="4.5" cy="12.5" r="1.7" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="11.5" cy="5.5" r="1.7" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M4.5 5.2v5.6M11.5 7.2c0 2.6-7 1.6-7 3.6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>Git</button><nav id="workspace-tabs" aria-label="Workspaces"></nav><button id="new-workspace" class="icon" aria-label="New workspace" title="New workspace">+</button><div id="chat-search" class="chat-search" role="search"><svg class="chat-search-icon" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.4 10.4l3.6 3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><input id="chat-search-input" type="search" placeholder="Search chats" aria-label="Search chats" autocomplete="off" spellcheck="false" aria-controls="chat-search-results" aria-expanded="false"><kbd class="chat-search-key">⌘K</kbd><div id="chat-search-results" class="chat-search-results" role="listbox" aria-label="Chats found" hidden></div></div><div id="status-counts" class="status-counts" role="status" aria-live="polite"></div></header><div id="overview" class="overview" hidden role="region" aria-label="Overview of all workspaces"><div id="overview-columns" class="overview-columns"></div></div><div id="git-view" class="overview git-view" hidden role="region" aria-label="Git branches and pull requests"><div id="git-body" class="git-body"></div></div><aside><div class="sidebar-top"><button id="new-terminal" class="new-terminal">+ <span>Terminal</span></button><button id="grid-button" title="Columns and rows">2 × 4</button></div><nav id="terminals" aria-label="View a terminal"></nav><section id="git-side" class="git-side" aria-label="GitHub repositories in this workspace" hidden></section><section id="usage" aria-label="Subscription limits"></section><div class="sidebar-footer"><div class="sidebar-links"><button id="prompts-button" class="history-button">Prompts</button><button id="spaces-button" class="history-button">Spaces</button><button id="history-button" class="history-button">History</button><button id="goals-history-button" class="history-button">Goals</button></div><div class="sidebar-toggles"><button id="phone-toggle" class="icon phone-toggle" aria-pressed="false" aria-label="Phone access" title="Phone access: off"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="4.5" y="1.5" width="7" height="13" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="12.2" r=".8" fill="currentColor"/></svg></button><button id="background-toggle" class="icon" aria-label="Use colored text" aria-pressed="true" title="Use colored text">◐</button><button id="theme-toggle" class="icon" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">☾</button></div></div></aside><div id="sidebar-resizer" role="separator" tabindex="0" aria-label="Resize left panel" aria-orientation="vertical" title="Drag to resize left panel"></div>
<main><div id="grid-quick" class="view-zoom grid-quick" role="group" aria-label="Grid size"><span class="grid-quick-label">Columns</span><button id="grid-col-remove" type="button" title="Remove the last column" aria-label="Remove a column">−</button><span id="grid-quick-cols"></span><button id="grid-col-add" type="button" title="Add a column" aria-label="Add a column">+</button><span class="grid-quick-label">Rows</span><button id="grid-row-remove" type="button" title="Remove the last row" aria-label="Remove a row">−</button><span id="grid-quick-rows"></span><button id="grid-row-add" type="button" title="Add a row" aria-label="Add a row">+</button><button id="grid-more" type="button" class="grid-more" title="Layouts…" aria-label="More layouts">⊞</button></div><div id="canvas-zoom" class="view-zoom canvas-zoom" role="group" aria-label="Middle section text size"><button id="canvas-zoom-out" type="button" title="Smaller text in the middle section" aria-label="Smaller text in the middle section">−</button><span id="canvas-zoom-size" title="Double-click to reset" aria-live="polite"></span><button id="canvas-zoom-in" type="button" title="Larger text in the middle section" aria-label="Larger text in the middle section">+</button></div><div id="canvas-scroll"><div id="canvas"></div></div><div id="notice" role="status" hidden></div></main>
<div id="view-resizer" role="separator" tabindex="0" aria-label="Resize right panel" aria-orientation="vertical" title="Drag to resize right panel"></div><section id="inspector" aria-label="Terminal view"><div id="view-zoom" class="view-zoom" role="group" aria-label="Text size" hidden><button id="view-zoom-out" type="button" title="Smaller text in the right panel" aria-label="Smaller text in the right panel">−</button><span id="view-zoom-size" title="Double-click to match the middle section" aria-live="polite"></span><button id="view-zoom-in" type="button" title="Larger text in the right panel" aria-label="Larger text in the right panel">+</button></div><div id="view-body"></div></section>
<section id="queue-panel" aria-label="Queued messages"><div id="router-jobs" role="status"></div></section>
<section id="router"><form id="router-form"><textarea id="router-input" rows="1" maxlength="50000" aria-label="Message Claude router" placeholder="Define what you want."></textarea><button class="icon" aria-label="Send message" title="Send message">↑</button></form></section><dialog id="prompts-editor"><div class="dialog-heading"><h2>Prompts <span id="prompts-count" aria-live="polite"></span></h2><button id="prompts-close" class="icon" aria-label="Close prompts">×</button></div><label class="prompts-today"><input id="prompts-today" type="checkbox">Today</label><input id="prompts-search" type="search" placeholder="Search prompts" aria-label="Search prompts"><div id="prompts-terminals" class="prompts-terminals" role="group" aria-label="Filter by terminal"></div><div id="prompts-list"></div></dialog><dialog id="editor"><form id="terminal-form"><div class="dialog-heading"><h2 id="dialog-title">New terminal</h2><button type="button" class="icon cancel" aria-label="Cancel">×</button></div><label>Title<input id="name" maxlength="80" required autocomplete="off" placeholder="Terminal title"></label><label id="folder-label">Folder<div class="folder-input"><input id="cwd" required><button type="button" id="browse">Choose…</button></div></label><label id="workspace-label" hidden>Workspace<select id="terminal-workspace"></select></label><div class="span-fields"><label>Columns<input id="col-span" type="number" min="1" max="8" value="1" required></label><label>Rows<input id="row-span" type="number" min="1" max="16" value="1" required></label></div><fieldset><legend>Color</legend><div id="colors"></div></fieldset><p id="form-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" class="cancel">Cancel</button><button type="submit" class="primary" id="save">Create terminal</button></div></form></dialog>

<dialog id="workspace-editor"><form id="workspace-form"><h2 id="workspace-dialog-title">New workspace</h2><label>Name<input id="workspace-name" maxlength="60" required autocomplete="off"></label><div class="dialog-actions"><button id="workspace-cancel" type="button">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog>
<dialog id="grid-editor"><form id="grid-form"><div class="dialog-heading"><h2>Grid</h2><button type="button" id="grid-close" class="icon" aria-label="Close">×</button></div><div id="grid-presets" class="grid-presets" role="group" aria-label="Layouts"></div><div class="span-fields"><label>Columns<input id="grid-cols" type="number" min="1" max="8" required></label><label>Rows<input id="grid-rows" type="number" min="1" max="16" required></label></div><div id="grid-preview" class="grid-preview" aria-hidden="true"></div><p id="grid-preview-note" class="grid-preview-note"></p><p id="grid-error" class="error"></p><div class="dialog-actions"><button type="button" id="grid-cancel">Cancel</button><button type="submit" class="primary">Apply</button></div></form></dialog><dialog id="resume-editor"><h2>Resume Claude</h2><div id="resume-chats"></div><form id="resume-form"><label>Session ID<input id="resume-id" required autocomplete="off"></label><p id="resume-error" class="error"></p><div class="dialog-actions"><button type="button" id="resume-cancel">Cancel</button><button type="submit" class="primary">Resume</button></div></form></dialog><dialog id="history-editor"><div class="dialog-heading"><h2>Closed terminals</h2><button type="button" id="history-archive" class="history-archive" title="Open the folder with the text of every closed chat">Chat archive</button><button type="button" id="history-close" class="icon" aria-label="Close history">×</button></div><div id="history-list"></div><p id="history-error" class="error" role="status"></p></dialog><dialog id="goal-editor"><form id="goal-form"><div class="dialog-heading"><h2 id="goal-heading">New goal</h2><button type="button" id="goal-close" class="icon" aria-label="Close">×</button></div><p id="goal-context" class="goal-context" hidden></p><label class="goal-field"><span id="goal-label">Goal</span><textarea id="goal-text" rows="3" maxlength="50000" required placeholder="What should be true when this is done?"></textarea></label><label class="goal-field" id="goal-subgoals-field"><span>Subgoals <small>optional · one per line</small></span><textarea id="goal-subgoals" rows="3" placeholder="Pick a domain&#10;Build the hero section"></textarea></label><label class="goal-check" id="goal-terminal-field"><input type="checkbox" id="goal-terminal" checked><span>Open a Claude terminal for this goal<small>Or leave it off and drag the goal onto existing terminals.</small></span></label><div class="goal-field" id="goal-terminals-field" hidden><span>Terminals <small id="goal-terminals-hint"></small></span><div id="goal-terminals" class="goal-terminal-chips"></div></div><p id="goal-error" class="error"></p><div class="dialog-actions"><span class="dialog-hint">⌘↩ to save</span><button id="goal-cancel" type="button">Cancel</button><button type="submit" class="primary" id="goal-submit">Create goal</button></div></form></dialog><dialog id="spaces-dialog" class="spaces-dialog"><div class="dialog-heading"><h2>Spaces</h2><button type="button" id="spaces-close" class="icon" aria-label="Close spaces">×</button></div><div id="spaces-list"></div><p id="spaces-error" class="error" role="status"></p></dialog><dialog id="goals-history"><div class="dialog-heading"><h2>Goals</h2><button id="goals-history-close" class="icon" aria-label="Close goals">×</button></div><div id="goals-history-list"></div></dialog><dialog id="phone-dialog" class="phone-dialog"><div class="dialog-heading"><h2>Phone</h2><button type="button" id="phone-close" class="icon" aria-label="Close">×</button></div>
<section class="phone-section"><label class="goal-check"><input type="checkbox" id="phone-web-enabled"><span>Terminator on your iPhone<small>Your workspaces, goals and terminals on your phone: watch them live and reply. Works anywhere through Tailscale.</small></span></label>
<div id="phone-web-body" class="phone-web-body" hidden><p id="phone-web-status" class="phone-status"></p><button type="button" id="phone-web-approve" class="phone-approve" hidden>Allow secure address in Tailscale…</button><img id="phone-web-qr" class="phone-qr" alt="Pairing code" hidden><ol id="phone-web-steps" class="phone-steps"></ol><div class="phone-actions"><button type="button" id="phone-web-copy">Copy link</button><button type="button" id="phone-web-reset">New pairing code</button></div></div></section>
<section class="phone-section"><label class="goal-check"><input type="checkbox" id="phone-rc-enabled"><span>Claude Remote Control<small>Also connect each Claude chat to the Claude app (Code tab) and claude.ai/code.</small></span></label></section>
</dialog><dialog id="confirm-dialog"><form id="confirm-form" method="dialog"><h2 id="confirm-title"></h2><p id="confirm-message" class="confirm-message"></p><ul id="confirm-list" class="confirm-list"></ul><div class="dialog-actions"><button type="submit" value="cancel" id="confirm-cancel">Cancel</button><button type="submit" value="ok" class="primary" id="confirm-ok">OK</button></div></form></dialog><script src="renderer.js"></script></body></html>
